# Generic localization & text-layout defect ruleset.
#
# Use when you have ONE folder of mixed screenshots (no per-feature split):
# every screen runs through the same visual-defect rules.
#
# EDIT ME: replace "Vietnamese" with your build's target language
# (rules: no_untranslated_text, not_wrong_language, no_mixed_languages).
#
# Run:
#   uv run python -m jev_ui_agent check-screenshots \
#     --dir <screens-folder> --rules rules/localization.yaml --out reports/l10n
#
# Detects ONLY: text clipping, text overflow, overlapping text, overlapping
# UI elements, untranslated text, localization keys, mixed languages, wrong
# language, translation-caused wrapping, localization-induced layout breaks.
# Ignores: business logic, feature behavior, wording/grammar quality,
# color/font/design preferences.
name: localization_defects
rules:
  # --- text & layout rendering ---
  - id: no_text_clipping
    instruction: "No text is clipped or cut off: every character of every visible label, title, button, tab and input text is fully rendered, with no lines or words sliced off at an edge. (Visual layout defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"

  - id: no_text_overflow
    instruction: "No text overflows its container: texts fit inside their buttons, input fields, badges, cards and list rows without spilling past or touching the container edges. (Visual layout defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"

  - id: no_overlapping_text
    instruction: "No text overlaps other text: every text element is clearly separated from every other text element, with no two texts rendered on top of each other. (Visual layout defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"

  - id: no_overlapping_elements
    instruction: "No UI elements unintentionally overlap each other: buttons, input fields, images, icons, banners and navigation bars do not cover one another; each element's area is visually distinct. Text rendered over a photo or illustration background is acceptable. (Visual layout defect only - ignore business logic, behavior, and color, font or design preferences.)"

  # --- localization / language ---
  - id: no_untranslated_text
    instruction: "All user-visible text is fully translated into Vietnamese: no leftover untranslated source-language strings (for example English) remain in buttons, labels, menus, hints or error messages. Proper nouns and brand names are acceptable. (Localization defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"

  - id: no_localization_keys
    instruction: "No raw localization keys, resource IDs or format placeholders are displayed to the user: text never looks like 'login.title', 'auth.subtitle.hint', 'menu.settings_label', '{username}' or '%s'. (Localization defect only - ignore business logic, behavior, and color, font or design preferences.)"

  - id: no_mixed_languages
    instruction: "The screen uses a single language consistently: user-visible text is in Vietnamese and does not unintentionally mix two languages in the same view. Proper nouns, brand names and technical symbols are acceptable. (Localization defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"

  - id: not_wrong_language
    instruction: "The language of all user-visible text matches the expected target language: the screen is in Vietnamese, not in another language (for example English, Chinese or Japanese). (Localization defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"

  # --- translation-induced layout damage ---
  - id: no_translation_wrapping
    instruction: "No text wraps awkwardly because of translation length: no single orphan word alone on the last line of a narrow button or label, no words broken mid-word across lines, no line wrapping that makes a short control look broken. (Translation-caused layout defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"

  - id: no_l10n_layout_break
    instruction: "The layout withstands the translated text: longer translations do not push elements off-screen, squeeze buttons or input fields into unreadable sizes, break alignment of columns or rows, or make any element disappear. (Localization-induced layout defect only - ignore business logic, behavior, wording or grammar quality, and color, font or design preferences.)"
